# Set 3, the published set (Work_on_hfs_plan.md, Step 7b; README, "Set 3").
#
# Levels and lines at their centers of gravity.  This set is DERIVED: its
# table, line list and report are written by make_set3.py from iter_hfs/,
# whose fit and assignments it re-expresses at the centers of gravity, and
# it is never classified (classify_lines.py, insert_new_level.py,
# move_level.py and discard_level.py refuse it; config.require_not_derived).
# After a change in iter_hfs/, run make_set3.py again, then the chain from
# here: make_LOPT_input.py, lopt.bat LOPT.par, check_sync.py, sync_IDEN2.py.
#
# Everything not written here is iter_hfs/'s, and through it iter/'s and the
# baseline's.  [hfs] apply stays on: make_LOPT_input.py then leaves out the
# level widths the correction replaces (D13) exactly as in iter_hfs/, and
# adds each line's u_hfs_shift - which make_set3.py cuts to the part owed to
# levels without a determined A; lopt_perturb.py carries the rest - while
# hfs_shift is 0: the lines are already where LOPT is to see them.
derived_from = "make_set3.py"
inherit = "../iter_hfs/lineclass_config.toml"

[files]
# make_set3.py's line list: iter/'s corrected list with the Set 3 columns
# beside Sugar's (own_cg, cg_shift, u_cg, char_set3, Icor_set3, merged_into).
lines      = "Pr3_lines_set3.xlsx"
output     = "line_classifications.xlsx"
output_csv = "line_classifications.csv"
start_levels = "LOPT_output_levels.txt"
# The shared registry of hand-set uncertainties less the rows of the lines
# merged into others, which are no lines of this set (make_set3.py writes it
# on every run; the registry is edited in LineClass/, not here).
inflated_unc = "inflated_unc_lines.txt"

[lines.layout.columns]
# The wavenumber of a line is its center of gravity; its uncertainty here is
# the measurement's - the move's own is u_cg (u_hfs_shift in the table),
# added by make_LOPT_input.py.  A line is still named by Sugar's value, so
# the shared ledger and registries go on naming it.
wn     = "own_cg"
u_wn   = "unc_own_corr"
wn_key = "own"

[widths]
# level_positions.py's width model (its section 4), refitted on this set
# (Work_on_hfs_plan.md Step 7, 2026-10-11): maximum likelihood on the LOPT
# residuals of 4046 features with a firm Ritz value, one per blended
# feature, with the anomalous-position mixture and each residual's variance
# (1 - h)^2 sigma^2 + (1 - h) u_Ritz^2, h the line's leverage in LOPT's fit.
# rms of residual / sigma 0.99 overall and 0.9 - 1.1 in every character
# class; single wavenumber bands stay off by up to about 20 % (the 1974
# lines below 20000 cm^-1 and 47500 - 52000 too generous, 52000 - 80000
# too tight - the same in iter_hfs/ against the table's own uncertainties),
# which the user accepted rather than add constants (2026-10-11).  The
# floor, about twice the baseline's, is found flat over 20000 - 47500
# cm^-1; its cause is not known (an empirical trend).  The program's own
# constants, which the other sets keep, were fitted on the baseline.
unc_floor = 0.0125           # cm^-1 (baseline 0.0055)
# The lines are at their centers of gravity: no per-level hyperfine width;
# what the hyperfine structure still does to a line is kappa_scatter below.
level_hfs_widths = false

[widths.reading]             # A, the plain reading error of each era
1974 = 0.0022                # (baseline 0.0030)
1969 = 0.0024                # (baseline 0.0040)

[widths.char_dlam]           # A, the wavelength-constant excess of a code
"1974/c"  = 0.0104           # (baseline 0.0337)
"1974/ch" = 0.0124           # (0.0103; 30 lines)
"1974/d"  = 0.0097           # (0.0073)
"1969/bl" = 0.0067           # (0.0085; 30 lines)
"1969/cl" = 0.0026           # (0.0044)
"1969/h"  = 0.0058           # (0.0082)
"1969/w"  = 0.0064           # (0.0104; 13 lines)

[widths.char_dwn]            # cm^-1, the wavenumber-constant excess of a code
"1974/w"   = 0.0273          # (baseline 0.0251)
# Sugar's *r and *v lines, moved to head - D: the baseline gave them no
# width of their own, its per-level widths carrying them
"1974/hfs" = 0.0410

[widths.kappa_scatter]       # s: a line gains s * |D|, the spread of kappa
1974 = 0.048                 # about its class times the width of the
1969 = 0.262                 # transition's pattern
