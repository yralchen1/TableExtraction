# The calibrated working set (README, "Three sets of LOPT files").
#
# Everything not written here is the baseline's: `inherit` reads
# ../lineclass_config.toml first and this file is laid on top of it, table by
# table.  The baseline's file names are resolved against the baseline's own
# directory before the merge, so the level workbook, the calculated
# transitions and - the point of the whole arrangement - the five files kept
# by hand go on being the project's single copies:
#
#   revised_level_energies.csv   line_decisions.csv
#   new_levels.txt               discarded_levels.csv
#   inflated_unc_lines.txt
#
# A verdict is about the physics of an assignment, not about the scale the
# line was last measured on, so it rules on every set at once.  What makes
# that possible is `wn_key` below.
inherit = "../lineclass_config.toml"

[files]
# Sugar's line list with the calibration applied: his own `own` and `unc_own`
# left exactly as they are, and the corrected values added beside them as
# `own_corr` and `unc_own_corr`.  Written by wavelength_calibration.py from
# wavelength_calibration_corrections.csv, which is not itself readable as a
# line list - it carries no intensity, no line character and no published
# identification.
lines      = "Pr3_lines_corrected.xlsx"
# This set's own output, so that a run here cannot overwrite the baseline's
# table and leave it disagreeing with the baseline's LOPT and IDEN2 files.
output     = "line_classifications.xlsx"
output_csv = "line_classifications.csv"

[lines.layout.columns]
# The corrected wavenumbers are what this set is optimized on.  The columns
# are looked up by name in the header row, so pointing `wn` at another column
# is the whole of the change: no reader knows the difference.
wn     = "own_corr"
u_wn   = "unc_own_corr"
# ...but an observed line is still NAMED by Sugar's value.  The corrections
# reach 0.66 cm^-1, sixty-six times the 0.01 cm^-1 within which
# classify_lines.attach_line_decisions matches a ledger row to its line, so a
# ledger keyed on the wavenumbers this set works with would be a second,
# diverging copy.  Keyed on the name, one ledger serves all three sets.
wn_key = "own"
