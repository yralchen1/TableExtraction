# Configuration for the Pr III line-classification pipeline.
#
# Every input-file name, worksheet name and column name used by the readers is
# listed here, so that a change in the layout of an input workbook needs no
# change in the code.  Columns are given by their NAME in the header row of the
# worksheet (row 1), not by position: the readers look the name up in that row.
#
# Relative paths are interpreted relative to the directory holding this file.

# The baseline is frozen (2026-09-30): the work goes on in iter/.  With this
# on, classify_lines.py, make_LOPT_input.py and sync_IDEN2.py refuse to write
# any file of this directory's set - its classification table, its LOPT
# files, its IDEN2 - and insert_new_level.py, move_level.py and
# discard_level.py refuse a run on it, unless given --unlock.  A lock is not
# inherited: iter/lineclass_config.toml reads this file and is not locked by
# it.  The hand-kept files here (line_decisions.csv, new_levels.txt, ...) are
# shared by every set and stay writable.  See config.require_unlocked.
locked = true

[files]
levels     = "../TableExtraction/Pr3_lev_Wyart_1999.xlsm"  # adopted energy levels
lines      = "Pr3_lines.xlsx"                              # observed spectral lines
icalc      = "Icalc.xlsx"                                  # calculated transitions
output     = "line_classifications.xlsx"                   # main output workbook
output_csv = "line_classifications.csv"                    # the same table as csv
# Revised adopted energies (columns level_id, E_input, and a free comment
# column recording where each value comes from).  A level listed here is read
# at that energy instead of the one in the levels workbook, which is an
# external published list and is never edited.  This is how a level that the
# identification work has re-positioned enters the pipeline: its candidate
# transitions are generated at the new energy, decoy_mc.py plants its decoys
# around the new energy, and level_shifts.py measures dE from it.  Comment the
# line out to run on Wyart's energies unchanged.
level_overrides = "revised_level_energies.csv"
# The decision ledger (columns wn_obs, low_id, upp_id, decision, and the free
# columns date and reason).  Each row is a verdict reached by hand - in IDEN2,
# or in a trial LOPT run - on one assignment of one observed line: "accept" or
# "reject".  It is applied after every automatic step, so it has the last word
# on the assignments it names, and only assignments it does not name can move
# between two runs.  Chance-coincidence and decoy runs ignore it: they measure
# what the algorithm alone does.  Comment the line out to see the unaided
# classification.
line_decisions = "line_decisions.csv"
# Levels identified since the adopted level list was published (columns
# level_id, E, J, parity, and a free comment).  A level found in IDEN2 does
# not exist in any input file: it has no row in the level workbook and no
# calculated transitions in Icalc.xlsx, so nothing in the pipeline could ever
# propose a line for it.  These two files are how it enters, and they are the
# exact analogue of revised_level_energies.csv - small csv/xlsx files under
# the analyst's hand, added to inputs that are never edited.  The level id is
# the next one free: the last six digits of the largest id in use, plus one.
# Tab-separated, because Excel turns the J value "7/2" into a date when it
# opens a .csv and offers no way to stop it; opening a .txt gives the import
# dialogue, where the J column can be declared Text.  A .csv is still read
# (the delimiter follows the extension).  Two further columns, written by
# insert_new_level.py, say which calculated level the new level is: iden2_row,
# its row of IDEN2/enlev.dat, and cowan_lid, its level number in the Cowan
# calculation.  cowan_lid is what its calculated transitions are found by.
new_levels = "new_levels.txt"
# The calculated transitions of those levels, in the layout of Icalc.xlsx.
# NO LONGER NEEDED, and commented out: a level carrying a cowan_lid has its
# transitions read straight from the Cowan transition list tp_E1_no_trials.xlsx
# by classify_lines.read_cowan_transitions(), which is where the rows of this
# workbook were copied from by hand in the first place.  The setting is kept
# because it still works and still has the last word - a pair listed here
# overrides the derived one - so a transition can be corrected by hand without
# touching the calculation.  Only the pairs involving a new level need be
# listed; every pair absent from all of them is treated by the completeness
# rule as before (gA below the printing cutoff of Cowan's codes).  The Icalc
# column is RECOMPUTED from gA with the C and kT of [intensity_model] on
# reading, so that these rows sit on the same intensity scale as Icalc.xlsx
# however they were made.
# icalc_extra = "icalc_new.xlsx"
# Levels whose measured position the work has GIVEN UP (columns level_id,
# iden2_row, date, ln_R, reason).  A level listed here is taken out of the
# level list for this run: no candidate is generated for it, no published
# identification naming it stands, and the validation runs stop counting it.
# It is not deleted - the calculation still predicts it, IDEN2 still carries
# its row, and unfound_levels.py ranks it again among the levels nobody has
# found - so a discard is a level returned to the pool it came from, dated and
# reasoned, and reversible by deleting its row here.  Written by
# discard_level.py.  Comment the line out to run on every level as found.
discarded_levels = "discarded_levels.csv"
# Lines whose wavenumber uncertainty has been set by hand (tab-delimited,
# columns wn_key, unc_wn, date, reason).  A line listed here has been looked
# at individually - it sits off the smooth trend of its block, or it carries
# an unresolved hyperfine structure - and its classification stands with the
# uncertainty given there in place of the one in the line list, unless the
# list's own is already wider (the registry only ever widens).  It is keyed
# on wn_key, Sugar's own wavenumber, matched within 0.01 cm^-1 as the ledger
# is, so one registry serves every set.
# classify_lines.py reads the line's uncertainty from here before any
# candidate is matched, so the Ritz windows, the grades and the level
# optimization all use the same value that LOPT is given (it reaches LOPT as
# unc_wn_obs of line_classifications.csv).  A missing file is an empty
# registry.  Comment the line out to run on the line list's own values.
inflated_unc = "inflated_unc_lines.txt"
# The magnetic-dipole hyperfine constants A of the levels (columns level_id,
# cfg, J, A_cm-1, u_A, source, n_flagged), read only when [hfs] apply is on;
# see that section below.
hfs_A_levels = "A_hfs_levels.csv"
# Resolved hyperfine companions (tab-delimited, columns wn_key, main_wn_key,
# low_id, upp_id, rung, blend, date, reason; a row starting with # is a
# comment).
# A companion is a weaker line of the line list a few tenths of a cm^-1 from
# a classified one, at the offset of the next rung of that transition's
# hyperfine pattern (F_low - k -> F_upp - k): both lines are the one
# transition.  Kept by hand, keyed on wn_key like the ledger.  The companion
# is written as that transition's hfs component (grade hfs), never accepted,
# so it stays out of LOPT and IDEN2, and no other candidate is sought for
# it; this holds with [hfs] apply off too.  With apply on, the main line's
# named transition takes kappa = 1, as a flagged line's does.  A companion
# marked blend = 1 is also a transition of its own: it is classified as any
# other line, and the hfs component, written beside it, keeps its share of
# the line's calculated intensity.  Read only by
# the real classification, not by the chance-coincidence calibration runs;
# wavelength_calibration.py reads it too and holds the main line's kappa at
# 1.  See hfs_correction.py.  Comment the line out to run without it.
hfs_satellites = "hfs_satellites.txt"
# Lines measured otherwise than their class says (tab-delimited, columns
# wn_key, low_id, upp_id, class, unresolved, date, reason; a row starting
# with # is a comment).  Kept by hand, keyed on wn_key like the ledger, one
# row per transition of a line.  class is head (kappa = 1), cg (kappa = 0)
# or a class of [hfs.kappa], whose value it then takes; the named
# transition is predicted, and the line corrected, with that kappa, and
# wavelength_calibration.py holds it there instead of fitting it.
# unresolved names levels of [hfs] resolved_levels whose sublevels the line
# does not separate (comma-separated): for that line they count with their
# whole pattern, S = I*A*J.  Read with [hfs] apply on.  See
# hfs_correction.py.  Comment the line out to run without it.
kappa_exceptions = "kappa_exceptions.txt"
# Sugar's resolved hfs components, one row per component, with the flagged
# line each belongs to (wn_line; written by hfs_components.py).  It splits
# the flagged lines (2026-10-06): one whose components he printed is the
# anchor, kappa = 1 ([hfs.kappa] flag); one whose components he did not print
# is of the class flag_unlisted, fitted with the plate calibration like the
# plain classes.  Read with [hfs] apply on and by the plate calibration.
# See hfs_correction.py.  Comment the line out to treat every flagged line
# as the anchor, as before.
hfs_components = "hfs_components.csv"

[range]
# Wavenumber interval of the observed spectrum (cm^-1).  Candidate transitions
# outside it are not generated.
wn_min = 9327.0
wn_max = 121665.0

[levels.layout]
sheet = "Wyart2000"

[levels.layout.columns]
# J      = adopted total angular momentum, as written ("5/2", "3", ...)
# E_ASD  = energy as listed in the NIST ASD; an empty cell means the level is
#          absent from the ASD, i.e. it is one of Wyart's new levels
# E      = adopted energy (cm^-1)
# parity = parity of the level, "e" (even) or "o" (odd)
# id     = unique level identifier used throughout the pipeline
# note   = free remark of the level list, carried along in the reports
J      = "J_adopt"
note   = "note"
E_ASD  = "E_ASD"
E      = "E_adopt"
parity = "par_ASD"
id     = "ASD_id"

[lines.layout]
sheet = "Sheet1"

[lines.layout.columns]
# wn        = observed wavenumber (cm^-1)
# u_wn      = its uncertainty (cm^-1)
# wn_key    = optional; the column an observed line is NAMED by in the files
#             kept by hand - line_decisions.csv above, and
#             inflated_unc_lines.txt.  It defaults to the wn column, which is
#             what this set wants: here the two are the same measurement.  A
#             calibrated set reads wn from a corrected column and leaves
#             wn_key on Sugar's original one, so that a line keeps its name
#             when the scale it is measured on changes and the ledgers do not
#             have to be copied per set (see iter/lineclass_config.toml).  It
#             is written out as a column of line_classifications.csv.
# intensity = observed intensity reduced to a uniform scale
# character = line-character flags of the original list ("bl", "w", ...)
# id1, id2  = level ids of the identification given in that list, if any
#             (the "legacy" identification)
wn        = "own"
u_wn      = "unc_own"
intensity = "Icor"
character = "Ch."
id1       = "id1"
id2       = "id2"

[icalc.layout]
sheet = "Icalc"

[icalc.layout.columns]
# id1, id2 = level ids of the lower and of the upper level of the transition
# rwn      = Ritz wavenumber (cm^-1)
# gA       = statistical weight times transition probability (s^-1)
# u_pct_gA = uncertainty of gA, in percent
# Icalc    = predicted intensity, on the scale of the observed intensities
# Eup      = energy of the upper level (cm^-1)
# u_ln     = uncertainty of gA on the logarithmic scale, ln(1 + u%gA/100)
id1      = "id1"
id2      = "id2"
rwn      = "rwn"
gA       = "gA"
u_pct_gA = "u%gA"
Icalc    = "Icalc"
Eup      = "Eup"
u_ln     = "u_ln"

[icalc.completeness]
# Cowan's codes printed only transitions with gA >= gA_cutoff, so the absence of
# a level pair from the file means gA < gA_cutoff, not that gA is unknown.
gA_cutoff = 1.0e3
# A few rows fall marginally below the cutoff after rescaling to Ritz
# wavenumbers; true = read them like any other row.
allow_below_cutoff = true

[missing_gA]
# How a candidate transition that is absent from the Icalc file is treated.
#   "none"   = the transition simply has no predicted intensity, and the
#              intensity tests are skipped for it (the behaviour before 2026-08)
#   "impute" = it is given the intensity implied by a gA just below the cutoff,
#              so that its predicted weakness counts against the identification
# "impute" is the adopted policy (Stage 5 of PLAN_missing_gA.md): it removes 45%
# of the in-situ decoy (false by construction) identifications at a cost of 1.1%
# of the real ones.  Use --missing-gA none to reproduce the earlier behaviour.
policy = "impute"
# Settings used only by "impute":
u_ln_window       = 10.0        # rms of u_ln over gA_cutoff <= gA <= window*gA_cutoff
u_ln_estimator    = "rms"       # rms | mean | median
self_consistent   = false       # true: iterate gA = cutoff*exp(-u_ln(gA)) on the linear fit
fit_range_decades = [3.0, 6.0]  # log10(gA) range used by that fit

[intensity_model]
# Relation obeyed by the file: Icalc = C * gA * (rwn/1e8) * exp(-Eup/kT), with
# Eup and rwn in cm^-1; 1e8/rwn is the vacuum wavelength in angstroms.  Used to
# turn an imputed gA into an intensity, and by level_shifts.py.
# C and kT come from the Boltzmann plot of the accepted observed intensities
# (tools/fit_boltzmann.py, two passes with |ln(Icalc/Iobs)| <= 2 in between),
# which also rewrote the Icalc column of the file with them.  These are the
# converged values: tools/iterate_boltzmann.py repeated fit -> rewrite Icalc ->
# reclassify until no Icalc in the file moved by as much as 1% in a round.
# History (all 2026-08-28):
#   C = 135.8,  kT = 12905 - with Icalc = C*gA*exp(-Eup/kT)/rwn, the wrong
#                            (photon-number) form; superseded.
#   C = 175.09, kT = 11954 - first fit of the energy-flux form, un-iterated.
#   C = 131.09, kT = 13009 - converged (3 rounds), observed intensities still
#                            on the hand-made plate calibration.
#   C = 252.87, kT = 12358 - converged (3 rounds, tol 0.005) after the plate
#                            calibration itself was refitted with the new gA
#                            values by tools/calibrate_intensities.py and put
#                            into Pr3_lines.xlsx by tools/apply_calibration.py.
#                            C rose by a factor ~1.9 mainly because the zero
#                            point of the new correction differs from the old
#                            one (P is fixed only up to an additive constant,
#                            and C absorbs it); the median observed intensity
#                            moved by a factor 1.39.
#   C = 245.68, kT = 12425 - converged (2 rounds, tol 0.005) after Sugar's own
#                            printed intensities were brought into the line
#                            list as the column Iorig by
#                            tools/attach_sugar_intensities.py and the plate
#                            calibration was refitted to them directly, so
#                            that nothing has to be reconstructed.  Iorig was
#                            still empty for the 23 lines whose ref column
#                            names Wyart.
#   C = 252.64, kT = 12366 - converged (2 rounds, tol 0.005) after those last
#                            23 lines were given their Iorig too (2026-08-29).
#                            They were measured by Sugar like all the others -
#                            ref names the author of the classification, not
#                            the observer - and are found in his two workbooks
#                            by wavenumber.  The plate calibration was refitted
#                            with them included.
#   C = 251.61, kT = 12375 - converged (1 round, tol 0.005) after the Ritz
#                            acceptance test was made non-circular: each
#                            level's energy uncertainty is now taken as
#                            its *other* accepted transitions leave it
#                            (u_energy_excluding() in classify_lines.py),
#                            so a transition can no longer widen the error
#                            bar it is judged against (2026-08-30).  The
#                            model barely moved - no Icalc changed by as
#                            much as 0.5% - because only 6 of 4880
#                            identifications were withdrawn.
#   C = 268.527, kT = 12242 - converged (2 rounds, tol 0.005) after the plate
#                            calibration was refitted with the two coverage
#                            gaps of Sugar's exposures imposed as region
#                            boundaries (1522.49-1529.85 and 2103.46-2107.92 A;
#                            DEFAULT_GAPS_A in tools/calibrate_intensities.py,
#                            COVERAGE_GAPS_A in level_shifts.py).  No exposure
#                            spans either gap, so nothing ever tied the
#                            intensity scales on their two sides together and
#                            the correction is genuinely discontinuous there;
#                            the previous fit had smeared those steps out by
#                            running single polynomials across them.  The scale
#                            now jumps by exp(3.45) at the first gap and
#                            exp(6.76) at the second.  Accepted
#                            identifications: 4874 -> 4891 (2026-08-31).
C  = 269.979733
kT = 12233.068631
# Warn if a re-fit on the file disagrees with C or kT by more than this
# fraction, instead of silently adopting the new values.
verify_tolerance = 0.01

[decisions]
# The decision ledger (files.line_decisions) is obeyed to the letter: an
# "accept" row puts its assignment into the run even when the automatic
# matching would never propose it, because a hand-made identification often
# rests on evidence the matching does not use.  That makes a row which has
# gone stale - one written while a level stood at an energy it has since been
# moved from - dangerous: it would drag the level back with the full weight of
# the line it names.  A row whose Ritz wavenumber E(upper) - E(lower), at the
# energies the run starts from, misses the wavenumber of its own line by more
# than this many cm^-1 therefore stops the run, and the message says which of
# the two levels was moved and when.
#
# 5.0 leaves room above the widest offset in the present ledger (2.13 cm^-1
# on 246 accepted rows, median 0.18).  A single row that is deliberately this
# far out is exempted by writing offset-ok anywhere in its reason column,
# rather than by raising the limit for every row.
max_forced_offset = 5.0

[blends]
# A line classified to several transitions is fitted as the centroid of its
# components, weighted by their calculated intensities, and those weights are
# not exact.  If each component's ln(Icalc) is uncertain by u_ln_intensity,
# the centroid is uncertain by
#     u_I = u_ln_intensity * sqrt( sum_i (w_i * (x_i - x_cg))^2 ),
# which classify_lines.py (its level fit) and make_LOPT_input.py (LOPT's
# input) add to the line's uncertainty in quadrature (blend_centroid.py).
# Two equal components delta apart get u_I = 0.117 * delta at 0.33.
# 0.33 is the upper end of the 68 % interval measured from the LOPT residuals
# of the blends of iter_hfs on 2026-10-09 (maximum likelihood 0.24); 0 or
# leaving the key out turns the term off.
u_ln_intensity = 0.33

[hfs]
# The head-frame hyperfine correction (Work_on_hfs_plan.md, Step 5, agreed
# 2026-09-29).  141Pr has nuclear spin I = 5/2, so a level of angular momentum
# J is split into sublevels, and every line into a pattern of components.
# Write S = I*A*J for the distance of a level's outermost sublevel, F = I+J,
# from the level's center of gravity, and D = S(upper) - S(lower) for the
# distance of a line's strongest component from the line's center of
# gravity.  The level energies of the pipeline, of LOPT and of IDEN2 are the
# F = I+J sublevels ("the head frame"), which is what Sugar's strongest
# components measure.  A line whose pattern Sugar did not resolve was
# measured (1 - kappa)*D below the head-frame Ritz wavenumber, kappa being
# the measurement convention of its class.  With apply = true:
#   classify_lines.py    predicts each candidate transition i of a line at
#                        Ritz_i - (1 - kappa)*D_i, and writes the line's
#                        correction hfs_shift = (1 - kappa)*sum BF_i*D_i
#                        (in a flagged blend only the strongest component
#                        takes the flag's kappa, the others the plain one);
#   make_LOPT_input.py   adds hfs_shift to the wavenumber it gives LOPT, and
#                        its uncertainty in quadrature to the line's.
# IDEN2's enlev.dat holds the head-frame energies, and dlv.dat the lines as
# measured unless iden2_display below says otherwise.  The centers of
# gravity, E_cg = E - I*A*J, are computed once at the end.  Off here, in the
# baseline; a set turns it on in its own configuration file.  Nothing changes
# when it is off.
apply = false
# What sync_IDEN2.py writes into the set's IDEN2/dlv.dat.  "measured" (the
# default): every line as measured, so IDEN2 shows each assigned line
# (1 - kappa)*D away from where LOPT puts it.  "lopt" (needs apply = true):
# every line the fit uses at the wavenumber and with the uncertainty LOPT is
# given, so the departure IDEN2 shows is LOPT's O-C; unassigned and
# rejected lines and hfs satellites stay as measured.  A moved line is drawn
# moved in every transition's view, and its spacing from unmoved neighbors
# is not the measured one, so line searches and satellite judgments are made
# in "measured".  The rows moved are listed in IDEN2/dlv_shown.txt.
iden2_display = "measured"
# Levels whose sublevels are resolved, so that each of their lines ends on
# one sublevel and their own A counts as 0 in D.  Two J = 1/2 levels of
# 4f2.6s, each standing at its F = 3 sublevel: 059003.000642 (IDEN2 row
# 1093, the F = 2 lines rejected) and 059003.000190 (IDEN2 row 1089).
resolved_levels = ["059003.000642", "059003.000190"]

[hfs.kappa]
# [kappa, its uncertainty] per class, as fitted jointly with the plate
# calibration in use (D12).  Since 2026-10-05 wavelength_calibration.py
# writes plain_1974, plain_1969 and c (and since 2026-10-06 flag_unlisted)
# here itself at the end of every run
# that writes its files (--keep-kappa to leave them; config.set_hfs_kappa),
# and replaces the two "# [wavelength_calibration.py]" lines above flag with
# when, from which table, and the values they replace.  Edit by hand only
# what it does not: this comment, and flag.
# History: pass 6 of 2026-10-05, the first through iter_hfs/'s hfs model
# (Step 4 A constants, A(000190) = -0.157, 26 lines held at a fixed kappa),
# gave plain_1974 0.850(13), plain_1969 0.651(21), c 0.172(51).  Pass 5 of
# 2026-10-04 (calculated A constants scaled by
# hfs_kappa.A_SCALE = 0.9638, D14; 83315.6988 inflated to 0.5 cm^-1) gave
# plain_1974 0.926(12), plain_1969 0.717(21), c 0.276(44).  Pass 4 gave
# plain_1974 0.925(12), plain_1969 0.712(20), c 0.276(44).  Pass 3, with every D scaled by 0.9582, gave plain_1974
# 0.924(12), plain_1969 0.708(21), c 0.271(44); before that they were the
# Step 3 values of hfs_kappa.py (2026-09-21): plain_1974 0.944(14),
# plain_1969 0.633(35), c 0.20(12).
#   flag        Sugar's *r and *v lines whose resolved components he
#               printed (files.hfs_components); measured at the strongest
#               component (Step 2), the anchor of the others
#   flag_unlisted  his *r and *v lines whose components he did not print:
#               the peak of an unresolved pattern, pulled towards the center
#               of gravity.  First value 0.895(24), from a scratch calibration
#               of 2026-10-06 on iter_hfs/'s table of 10:21; the next run of
#               wavelength_calibration.py replaces it
#   plain_1974  unflagged lines below 47500 cm^-1, measured in 1974
#   plain_1969  unflagged lines above it, measured in 1969
#   c           lines Sugar marked complex
# [wavelength_calibration.py] written 2026-10-09 08:14 from iter_hfs/line_classifications.csv (4491 lines);
# [wavelength_calibration.py] the values before: plain_1974 0.751(38), plain_1969 0.440(47), c 0.039(38), flag_unlisted 0.900(24)
flag          = [1.0, 0.0]
plain_1974    = [0.751, 0.038]
plain_1969    = [0.440, 0.047]
c             = [0.039, 0.038]
flag_unlisted = [0.900, 0.024]
